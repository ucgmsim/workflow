name: Deptry Dependency Check

on: [pull_request]
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install uv
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      # Install deptry
      - run: uv tool install deptry
      - run: uv lock
      - run: uv sync
      # Run deptry to check that all dependencies are present.
      - run: uv tool run deptry . --per-rule-ignores "DEP001=workflow,DEP002=workflow,DEP003=workflow"

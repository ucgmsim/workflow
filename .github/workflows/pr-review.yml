name: AI Code Review

on:
  issue_comment:
    types: [created]

jobs:
  call-review:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/review')
    uses: ucgmsim/ollama_pr_review/.github/workflows/pr-review.yml@v1.0
    secrets:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

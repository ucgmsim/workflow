name: Build and Upload Container

# Runs after a release is published to PyPI (called from publish-PyPI.yml),
# or manually to rebuild the image for an existing PyPI release.
on:
  workflow_call:
    inputs:
      version:
        description: 'ucgmsim-workflow version on PyPI to install'
        required: true
        type: string
      ref:
        description: 'Git ref to take the Dockerfile and uv.lock from (defaults to the triggering ref)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'ucgmsim-workflow version on PyPI to install'
        required: true
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: earthquakesuc/workflow-bootstrap

jobs:
  build-test-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # PyPI can take a little while to serve a freshly uploaded release. Poll
      # the simple index pip installs from: the JSON API can list a release
      # minutes before the simple index does.
      - name: Wait for the release to appear on PyPI
        run: |
          for _ in $(seq 30); do
            if curl -sf -H "Cache-Control: no-cache" "https://pypi.org/simple/ucgmsim-workflow/" \
                | grep -q "ucgmsim_workflow-${{ inputs.version }}-py3-none-any.whl"; then
              exit 0
            fi
            sleep 10
          done
          echo "ucgmsim-workflow ${{ inputs.version }} not found on PyPI" >&2
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      # Pin the image's dependencies to the lock CI tested this release against.
      - name: Export locked dependencies
        run: uv export --frozen --no-hashes --no-emit-project --no-dev -o container/constraints.txt

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: earthquakesuc
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./container/Dockerfile
          build-args: |
            WORKFLOW_VERSION=${{ inputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

---
# The 1 Hz defaults (26.7.1Hz) at half the frequency: the same source and
# physics, with the top 5 km at 200 m (the 1 Hz run's points per
# wavelength) and 400 m below, at a tenth or so of the cost. A quick look at
# an event. The coarsest grid matches 26.7.1Hz's, so the sponge and the
# minimum `fault_buffer` are the same.
bb:
  flo: 0.5
velocity_model:
  # Minimum that clears the SW4 sponge on a 400 m grid; see
  # `workflow.sw4.minimum_fault_buffer_m`.
  fault_buffer: 14.0
refinements:
  refinements:
    [{ resolution: 200.0, bottom: 5000.0 }]
  unbounded_refinement_resolution: 400.0
sw4:
  verbose: 2
  printcycle: 10
  nz_min: 12
  commands:
    - name: "grid"
      parameters:
        {
          proj: "tmerc",
          ellps: "GRS80",
          lon_p: 173.0,
          lat_p: 0.0,
          scale: 0.9996,
        }
    # In metres, so the sponge does not vary with the coarsest grid spacing.
    - name: "supergrid"
      parameters: { width: 12000.0 }
    - name: "attenuation"
      parameters: { maxfreq: 10.0, phasefreq: 0.5, nmech: 3 }
    - name: "developer"
      parameters: { cfl: 0.9, reporttiming: true, failonnan: true }
    # Matches the order-4, two-pass Butterworth highpass `bb-sim` applies to
    # the HF at `bb.flo`, so the two legs meet at half power:
    # fc2 = flo / (sqrt(2) - 1) ** (1 / 8). Run `bb-sim --filter hf` so the
    # LF is not filtered again.
    - name: "prefilter"
      parameters:
        { order: 4, passes: 2, fc1: null, fc2: 0.558235, type: "lowpass" }
    - name: "topography"
      parameters: { order: 4 }
    - name: "imagehdf5"
      parameters:
        { mode: "topo", z: 0.0, file: "topo", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "grid", z: 0.0, file: "grid", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "p", z: 0.0, file: "surf_vp", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "s", z: 0.0, file: "surf_vs", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "rho", z: 0.0, file: "surf_rho", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        {
          mode: "mag",
          z: 0.0,
          file: "surf_mag",
          timeInterval: 0.5,
          precision: "float",
        }
    - name: "imagehdf5"
      parameters:
        {
          mode: "velmag",
          z: 0.0,
          file: "surf_velmag",
          timeInterval: 0.5,
          precision: "float",
        }
    - name: "imagehdf5"
      parameters:
        {
          mode: "uz",
          z: 0.0,
          file: "surf_uz",
          timeInterval: 0.5,
          precision: "float",
        }
    - name: "imagehdf5"
      parameters:
        { mode: "hmax", z: 0.0, file: "surf_hmax", precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "vmax", z: 0.0, file: "surf_vmax", precision: "float" }

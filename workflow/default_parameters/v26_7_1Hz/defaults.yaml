---
bb:
  flo: 1.0
velocity_model:
  # Minimum that clears the SW4 sponge on a 400 m grid; see
  # `workflow.sw4.minimum_fault_buffer_m`.
  fault_buffer: 14.0
refinements:
  refinements:
    [
      { resolution: 100.0, bottom: 3000.0 },
      { resolution: 200.0, bottom: 25000.0 },
    ]
  unbounded_refinement_resolution: 400.0
sw4:
  verbose: 2
  printcycle: 10
  nz_min: 12
  commands:
    - name: "grid"
      parameters:
        {
          proj: "tmerc",
          ellps: "GRS80",
          lon_p: 173.0,
          lat_p: 0.0,
          scale: 0.9996,
        }
    # In metres, so the sponge does not vary with the coarsest grid spacing.
    - name: "supergrid"
      parameters: { width: 12000.0 }
    # SW4 fits Q over the two decades below `maxfreq`, so 0.025-2.5 Hz covers
    # this version's band. With 10 Hz the fit stopped at 0.1 Hz and Q was too
    # high below it. Three mechanisms, where the lower-frequency versions use
    # two: over a 64 km path at 1 Hz two gave a slightly worse waveform fit.
    - name: "attenuation"
      parameters: { maxfreq: 2.5, phasefreq: 0.5, nmech: 3 }
    # No `failonnan`: it scans seven full arrays for NaN every step, a tenth
      # of the run time. SW4's own health check still aborts on NaN, Inf or a
      # runaway solution every `printcycle` steps.
      parameters: { cfl: 1.3, reporttiming: true }
    # Matches the order-4, two-pass Butterworth highpass `bb-sim` applies to
    # the HF at `bb.flo`, so the two legs meet at half power:
    # fc2 = flo / (sqrt(2) - 1) ** (1 / 8). Run `bb-sim --filter hf` so the
    # LF is not filtered again.
    - name: "prefilter"
      parameters:
        { order: 4, passes: 2, fc1: null, fc2: 1.11647, type: "lowpass" }
    - name: "topography"
      parameters: { order: 4 }
    # The one-frame images (the cycle-0 surface fields here, and `hmax` and
    # `vmax` at the end) stay uncompressed: together they are a small fraction
    # of the movie frames, and `topo` and `grid` georeference those frames.
    - name: "imagehdf5"
      parameters:
        { mode: "topo", z: 0.0, file: "topo", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "grid", z: 0.0, file: "grid", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "p", z: 0.0, file: "surf_vp", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "s", z: 0.0, file: "surf_vs", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "rho", z: 0.0, file: "surf_rho", cycle: 0, precision: "float" }
    # Shake-movie frames every 0.1 s, compressed with ZFP in fixed-precision
    # mode. This is lossy: `zfp-precision` is the number of bit planes kept in
    # each 4 x 4 block, so the error scales with the local amplitude. The
    # movie colours waves on a log scale relative to the event's own peak, and
    # 12 keeps every pixel within about two of its 256 colour steps (99.9 %
    # within half a step) for any size of event, at about 7x smaller files: a
    # third less disk than the old uncompressed 0.5 s frames. A fixed
    # `zfp-accuracy` is not used because it is an absolute tolerance: one that
    # suits a Mw 6.5 speckles a small event's movie. Needs an SW4 with ZFP on
    # `imagehdf5`: one without it warns that it is ignoring the option and
    # writes the frames uncompressed, five times the volume of the old 0.5 s
    # interval. Readers need the H5Z-ZFP filter (`hdf5plugin` in Python).
    - name: "imagehdf5"
      parameters:
        {
          mode: "mag",
          z: 0.0,
          file: "surf_mag",
          timeInterval: 0.1,
          precision: "float",
          zfp-precision: 12,
        }
    - name: "imagehdf5"
      parameters:
        {
          mode: "velmag",
          z: 0.0,
          file: "surf_velmag",
          timeInterval: 0.1,
          precision: "float",
          zfp-precision: 12,
        }
    - name: "imagehdf5"
      parameters:
        {
          mode: "uz",
          z: 0.0,
          file: "surf_uz",
          timeInterval: 0.1,
          precision: "float",
          zfp-precision: 12,
        }
    - name: "imagehdf5"
      parameters:
        { mode: "hmax", z: 0.0, file: "surf_hmax", precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "vmax", z: 0.0, file: "surf_vmax", precision: "float" }

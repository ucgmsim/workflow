---
# The 1 Hz defaults (26.7.1Hz) at a quarter of the frequency: the same
# source and physics, with 400 m over the top 4.8 km (the 1 Hz run's points
# per wavelength at the surface) and 800 m below. A quick look at an event.
# Below the nzcvm Vs floor at 3 km an 800 m grid keeps 8 points per
# wavelength, but SW4 needs `nz_min` cells in the 400 m grid above it, so the
# transition sits at 12 x 400 m. There is no 1600 m grid: the sponge would be
# 7.5 cells of it, and SW4's grid-interface solve diverges below about 12.
bb:
  flo: 0.25
velocity_model:
  # Minimum that clears the SW4 sponge on an 800 m grid; see
  # `workflow.sw4.minimum_fault_buffer_m`.
  fault_buffer: 16.0
refinements:
  refinements: [{ resolution: 400.0, bottom: 4800.0 }]
  unbounded_refinement_resolution: 800.0
sw4:
  verbose: 2
  printcycle: 10
  nz_min: 12
  commands:
    - name: "grid"
      parameters:
        {
          proj: "tmerc",
          ellps: "GRS80",
          lon_p: 173.0,
          lat_p: 0.0,
          scale: 0.9996,
        }
    # In metres, so the sponge does not vary with the coarsest grid spacing.
    # 15 cells of the 800 m grid; SW4 is stable down to about 12.
    - name: "supergrid"
      parameters: { width: 12000.0 }
    - name: "attenuation"
      parameters: { maxfreq: 10.0, phasefreq: 0.5, nmech: 3 }
    - name: "developer"
      # No `failonnan`: it scans seven full arrays for NaN every step, a tenth
      # of the run time. SW4's own health check still aborts on NaN, Inf or a
      # runaway solution every `printcycle` steps.
      parameters: { cfl: 1.3, reporttiming: true }
    # Matches the order-4, two-pass Butterworth highpass `bb-sim` applies to
    # the HF at `bb.flo`, so the two legs meet at half power:
    # fc2 = flo / (sqrt(2) - 1) ** (1 / 8). Run `bb-sim --filter hf` so the
    # LF is not filtered again.
    - name: "prefilter"
      parameters:
        { order: 4, passes: 2, fc1: null, fc2: 0.279117, type: "lowpass" }
    - name: "topography"
      parameters: { order: 4 }
    - name: "imagehdf5"
      parameters:
        { mode: "topo", z: 0.0, file: "topo", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "grid", z: 0.0, file: "grid", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "p", z: 0.0, file: "surf_vp", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "s", z: 0.0, file: "surf_vs", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "rho", z: 0.0, file: "surf_rho", cycle: 0, precision: "float" }
    - name: "imagehdf5"
      parameters:
        {
          mode: "mag",
          z: 0.0,
          file: "surf_mag",
          timeInterval: 0.5,
          precision: "float",
        }
    - name: "imagehdf5"
      parameters:
        {
          mode: "velmag",
          z: 0.0,
          file: "surf_velmag",
          timeInterval: 0.5,
          precision: "float",
        }
    - name: "imagehdf5"
      parameters:
        {
          mode: "uz",
          z: 0.0,
          file: "surf_uz",
          timeInterval: 0.5,
          precision: "float",
        }
    - name: "imagehdf5"
      parameters:
        { mode: "hmax", z: 0.0, file: "surf_hmax", precision: "float" }
    - name: "imagehdf5"
      parameters:
        { mode: "vmax", z: 0.0, file: "surf_vmax", precision: "float" }

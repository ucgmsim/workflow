[nshm_to_realisation]
parameters = ["realisation"]
provides_config = [
  "sources",
  "rupture_propagation",
  "rakes",
  "magnitudes",
  "metadata",
]

[gcmt_to_realisation]
parameters = ["realisation"]
provides_config = [
  "sources",
  "rupture_propagation",
  "rakes",
  "magnitudes",
  "metadata",
]

[create_e3d_par]
parameters = ["realisation"]
requires_files = [
  "realisation.srf",
  "Velocity_Model/rho3dfile.d",
  "Velocity_Model/vs3dfile.s",
  "Velocity_Model/vp3dfile.p",
  "stations/stations.ll",
  "stations/stations.statcords",
]
requires_config = ["domain", "velocity_model_parameters", "metadata"]
provides_config = ["emod3d_parameters"]
provides_files = ["LF/e3d.par"]

[bb_sim]
parameters = ["realisation"]
requires_config = ["metadata", "domain"]
requires_files = ["realisation.lf", "realisation.hf", "stations/stations.vs30"]
provides_config = ["broadband_parameters"]
provides_files = ["realisation.bb"]

[generate_velocity_model]
requires_config = ["domain", "metadata"]
provides_config = ["velocity_model_parameters"]
provides_files = [
  "Velocity_Model/rho3dfile.d",
  "Velocity_Model/vp3dfile.p",
  "Velocity_Model/vs3dfile.s",
  "Velocity_Model/in_basin_mask.b",
]

[hf_sim]
parameters = ["realisation"]
requires_config = ["metadata", "domain"]
requires_files = ["stations/stations.ll", "realisation.stoch"]
provides_config = ["hf_config"]
provides_files = ["realisation.hf"]

[im_calc]
parameters = ["realisation"]
requires_files = ["realisation.bb"]
requires_config = [
  "broadband_parameters",
  "metadata",
  "sources",
  "rupture_propagation",
]
provides_config = ["intensity_measure_calculation_parameters"]
provides_files = ["intensity_measures.h5"]

[generate_velocity_model_parameters]
requires_config = [
  "metadata",
  "sources",
  "magnitudes",
  "rakes",
  "rupture_propagation",
]
provides_config = ["velocity_model_parameters", "domain"]

[realisation_to_srf]
parameters = ["realisation"]
requires_config = [
  "metadata",
  "rupture_propagation",
  "rakes",
  "magnitudes",
  "sources",
]
provides_config = ["srf_config"]
provides_files = ["realisation.srf"]

[generate_stoch]
parameters = ["realisation"]
requires_files = ["realisation.srf"]
requires_config = ["metadata", "sources"]
provides_files = ["realisation.stoch"]

[generate_station_coordinates]
requires_config = ["domain"]
requires_files = ["stations/stations_input.ll"]
provides_files = ["stations/stations.ll", "stations/stations.statcords"]

[emod3d]
parameters = ["realisation"]
requires_files = [
  "LF/e3d.par",
  "Velocity_Model/rho3dfile.d",
  "Velocity_Model/vp3dfile.p",
  "Velocity_Model/vs3dfile.s",
  "Velocity_Model/in_basin_mask.b",
  "realisation.srf",
  "stations/stations.ll",
  "stations/stations.statcords",
]
provides_files = ["LF"]

[lf_to_xarray]
parameters = ["realisation"]
requires_files = ["LF"]
provides_files = ["realisation.lf"]

[check_srf]
parameters = ["realisation"]
follows = "realisation_to_srf"

[check_domain]
parameters = ["realisation"]
follows = "generate_velocity_model"

[copy_domain_parameters]
parameters = ["realisation"]
follows = "check_domain"
